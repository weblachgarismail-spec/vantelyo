<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Vantelyo</title>
  <meta name="description" content="Read practical guides on food waste, kitchen organization, productivity and digital life from Vantelyo.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://weblachgarismail-spec.github.io/vantelyo/blog/">
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <meta name="theme-color" content="#2D5A27">
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <script src="../assets/js/i18n.js?v=6" defer></script>
  <script src="../assets/js/main.js?v=6" defer></script>
  <script src="../assets/js/consent.js?v=6" defer></script>
</head>
<body>
  <header class="header">
    <div class="container">
      <nav class="nav">
        <button class="mobile-menu-btn" aria-label="Menu" aria-expanded="false">☰</button>
        <div class="nav-brand"><a href="../index.html"><span>Smart</span>Life Innovations</a></div>
        <div class="lang-switch">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="ar">AR</button>
        </div>
        <ul class="nav-links">
          <li><a href="../apps/index.html" data-i18n="navApps">Apps</a></li>
          <li><a href="index.html" data-i18n="navBlog">Blog</a></li>
          <li><a href="../about.html" data-i18n="navAbout">About</a></li>
          <li><a href="../contact.html" data-i18n="navContact">Contact</a></li>
          <li><a href="../privacy.html" data-i18n="navPrivacy">Privacy</a></li>
          <li><a href="../publisher.html" data-i18n="navPublisher">Publisher</a></li><li><a href="../support.html" data-i18n="navSupport">Support</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div id="postRoot" class="article-wrap">
        <p class="blog-status" data-i18n="loadingArticles">Loading article…</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <span data-i18n="footerRights">© 2026 Vantelyo. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var root = document.getElementById('postRoot');
      var slug = new URLSearchParams(window.location.search).get('slug');

      function tr(key) {
        return typeof t === 'function' ? t(key) : key;
      }

      function formatDate(value) {
        var d = new Date(value);
        if (!value || isNaN(d.getTime())) return '';
        return d.toLocaleDateString(getLang() === 'fr' ? 'fr-FR' : 'en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showMessage(message) {
        root.innerHTML =
          '<p class="blog-status">' + message + '</p>' +
          '<p style="text-align:center;"><a class="article-back" href="index.html">← ' + tr('articleBack') + '</a></p>';
      }

      if (!slug) {
        showMessage(tr('articleNoSelection'));
        return;
      }

      fetch('../_data/blog.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function (data) {
          var posts = Array.isArray(data.posts) ? data.posts : [];
          var post = posts.filter(function (item) { return item.slug === slug; })[0];

          if (!post) {
            showMessage(tr('articleNotFound'));
            return;
          }

          document.title = post.title + ' — Vantelyo';
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.setAttribute('href', 'https://weblachgarismail-spec.github.io/vantelyo/blog/' + encodeURIComponent(post.slug) + '.html');

          var category = escapeHtml(post.categoryLabel || post.category || '');
          var readTime = escapeHtml(post.readTime || '');
          var date = escapeHtml(formatDate(post.date));
          var cover = post.image
            ? '<img class="article-cover" src="' + escapeHtml(post.image) + '" alt="' + escapeHtml(post.title) + '">'
            : '';

          var alternates = Array.isArray(post.alternates) ? post.alternates : (post.alternateSlug ? [{ lang: post.alternateLang, slug: post.alternateSlug }] : []);
          var altLink = alternates.map(function (alt) {
            var label = alt.lang === 'fr' ? tr('readInFrench') : (alt.lang === 'ar' ? tr('readInArabic') : tr('readInEnglish'));
            return '<a class="lang-alt" href="' + encodeURIComponent(alt.slug) + '.html">' + label + ' →</a>';
          }).join(' ');
          var altMap = {};
          alternates.forEach(function (alt) { altMap[alt.lang] = encodeURIComponent(alt.slug) + '.html'; });
          document.querySelectorAll('.lang-btn').forEach(function (btn) {
            var href = altMap[btn.dataset.lang];
            if (!href) return;
            btn.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopImmediatePropagation();
              try { window.localStorage.setItem('sli-lang', btn.dataset.lang); } catch (e) {}
              window.location.href = href;
            }, true);
          });

          var publisher = tr('footerPublisher');

          root.innerHTML = '' +
            '<a class="article-back" href="index.html">← ' + tr('articleBack') + '</a>' +
            '<article>' +
              '<header class="article-header">' +
                '<h1>' + escapeHtml(post.title) + '</h1>' +
                '<div class="article-meta">' +
                  (category ? '<span class="article-category">' + category + '</span>' : '') +
                  (date ? '<span>' + date + '</span>' : '') +
                  (readTime ? '<span>' + readTime + '</span>' : '') +
                '</div>' +
                altLink +
              '</header>' +
              cover +
              '<div class="article-body">' + (post.content || '<p>' + escapeHtml(post.excerpt || '') + '</p>') + '</div>' +
              '<div class="publisher-box">' + publisher + '</div>' +
            '</article>';
        })
        .catch(function (error) {
          console.error('Unable to load article:', error);
          showMessage(tr('articleLoadError'));
        });
    })();
  </script>
</body>
</html>
